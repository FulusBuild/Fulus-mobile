name: One-time Fulus implementation

on:
  push:
    branches: [main]
    paths-ignore:
      - '.github/workflows/ci-hotfix.yml'

permissions:
  contents: write

jobs:
  implement:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Apply cloud sync hardening
        shell: python
        run: |
          from pathlib import Path

          def write(path, content):
              Path(path).write_text(content)

          write('lib/sync/handlers/expense_sync_handler.dart', r'''import 'package:drift/drift.dart';

import '../../data/local/database/database.dart';
import '../../data/remote/fulus_connection_state.dart';
import '../../data/remote/fulus_sync_api.dart';
import '../../domain/repositories/expense_repository.dart';
import '../sync_handler.dart';

/// Pushes expenses through the authoritative Fulus Cloud command API.
/// There is deliberately no API_BASE_URL fallback on the cloud path.
class ExpenseSyncHandler implements SyncHandler {
  ExpenseSyncHandler({
    required AppDatabase db,
    required FulusSyncApi fulusSyncApi,
    required FulusConnectionState fulusConnectionState,
    required ExpenseRepository expenseRepository,
  })  : _db = db,
        _fulusSyncApi = fulusSyncApi,
        _fulusConnectionState = fulusConnectionState,
        _expenseRepository = expenseRepository;

  final AppDatabase _db;
  final FulusSyncApi _fulusSyncApi;
  final FulusConnectionState _fulusConnectionState;
  final ExpenseRepository _expenseRepository;

  @override
  Future<void> sync(SyncQueueItem item) async {
    if (item.operation != 'create') {
      throw StateError('ExpenseSyncHandler supports only create.');
    }
    final expense = await _expenseRepository.getExpenseById(item.entityLocalId);
    if (expense == null) throw StateError('No local expense found for ${item.entityLocalId}.');
    if (expense.serverId?.isNotEmpty == true) return;

    final businessId = _fulusConnectionState.selectedBusinessId;
    final device = _fulusConnectionState.registeredDevice;
    if (businessId == null || businessId.isEmpty || device?.status != 'active') {
      throw StateError('Fulus Cloud device authorization is required for expense sync.');
    }

    final location = await (_db.select(_db.locations)
          ..where((l) => l.localId.equals(expense.locationId)))
        .getSingleOrNull();
    final locationId = location?.serverId;
    if (locationId == null || locationId.isEmpty) {
      throw StateError('Expense location has no server identity yet.');
    }

    var category = 'general';
    final categoryId = expense.categoryId;
    if (categoryId != null && categoryId.isNotEmpty) {
      final row = await (_db.select(_db.expenseCategories)
            ..where((c) => c.localId.equals(categoryId)))
          .getSingleOrNull();
      category = row?.name ?? category;
    }

    final result = await _fulusSyncApi.submitOperation(
      businessId: businessId,
      operationType: 'expense.create',
      operationId: item.id,
      clientReference: expense.localId,
      deviceClientId: device!.deviceClientId,
      payload: {
        'business_id': businessId,
        'operation_id': item.id,
        'amount': expense.amount,
        'category': category,
        'description': expense.description,
        'location_id': locationId,
        'expense_date': expense.expenseDate.toIso8601String(),
        if (expense.paymentMethod != null) 'payment_method': expense.paymentMethod,
      },
    );
    final data = result['data'];
    if (data is! Map) throw StateError('Fulus expense sync returned no response data.');
    final serverId = (data['entity_id'] ?? data['id'])?.toString();
    if (serverId == null || serverId.isEmpty) throw StateError('Fulus expense sync returned no server entity ID.');
    await _expenseRepository.markSynced(localId: expense.localId, serverId: serverId);
  }
}
''')

          write('lib/sync/handlers/return_sync_handler.dart', r'''import 'package:drift/drift.dart';

import '../../data/local/database/database.dart';
import '../../data/remote/fulus_connection_state.dart';
import '../../data/remote/fulus_sync_api.dart';
import '../../domain/repositories/return_repository.dart';
import '../sync_handler.dart';

/// Pushes returns through the authoritative Fulus Cloud command API.
class ReturnSyncHandler implements SyncHandler {
  ReturnSyncHandler({
    required AppDatabase db,
    required FulusSyncApi fulusSyncApi,
    required FulusConnectionState fulusConnectionState,
    required ReturnRepository returnRepository,
  })  : _db = db,
        _fulusSyncApi = fulusSyncApi,
        _fulusConnectionState = fulusConnectionState,
        _returnRepository = returnRepository;

  final AppDatabase _db;
  final FulusSyncApi _fulusSyncApi;
  final FulusConnectionState _fulusConnectionState;
  final ReturnRepository _returnRepository;

  @override
  Future<void> sync(SyncQueueItem item) async {
    if (item.operation != 'create') throw StateError('ReturnSyncHandler supports only create.');
    final request = await _returnRepository.getReturnById(item.entityLocalId);
    if (request == null) throw StateError('No local return found for ${item.entityLocalId}.');
    if (request.serverId?.isNotEmpty == true) return;

    final businessId = _fulusConnectionState.selectedBusinessId;
    final device = _fulusConnectionState.registeredDevice;
    if (businessId == null || businessId.isEmpty || device?.status != 'active') {
      throw StateError('Fulus Cloud device authorization is required for return sync.');
    }

    final sale = await (_db.select(_db.sales)
          ..where((s) => s.localId.equals(request.originalSaleLocalId)))
        .getSingleOrNull();
    final saleId = sale?.serverId;
    if (saleId == null || saleId.isEmpty) {
      throw StateError('Return cannot sync before its original sale is synced.');
    }

    final rows = await (_db.select(_db.returnItems)
          ..where((r) => r.returnLocalId.equals(request.localId)))
        .get();
    final items = <Map<String, dynamic>>[];
    for (final row in rows) {
      final product = await (_db.select(_db.products)
            ..where((p) => p.localId.equals(row.productLocalId)))
          .getSingleOrNull();
      final productId = product?.serverId;
      if (productId == null || productId.isEmpty) {
        throw StateError('Return product ${row.productLocalId} has no server identity yet.');
      }
      items.add({'product_id': productId, 'quantity': row.quantity});
    }

    final result = await _fulusSyncApi.submitOperation(
      businessId: businessId,
      operationType: 'return.create',
      operationId: item.id,
      deviceClientId: device!.deviceClientId,
      clientReference: request.localId,
      payload: {
        'business_id': businessId,
        'sale_id': saleId,
        'operation_id': item.id,
        'reason': request.returnReason,
        'refund_amount': request.refundAmount,
        'refund_method': request.refundMethod,
        'items': items,
      },
    );
    final data = result['data'];
    if (data is! Map) throw StateError('Fulus return sync returned no response data.');
    final serverId = (data['entity_id'] ?? data['id'])?.toString();
    if (serverId == null || serverId.isEmpty) throw StateError('Fulus return sync returned no server entity ID.');
    await _returnRepository.markSynced(localId: request.localId, serverId: serverId);
  }
}
''')

          write('lib/sync/handlers/stock_movement_sync_handler.dart', r'''import '../../data/local/database/database.dart';
import '../../data/remote/fulus_connection_state.dart';
import '../../data/remote/fulus_sync_api.dart';
import '../../domain/entities/stock_movement.dart';
import '../../domain/repositories/product_repository.dart';
import '../../domain/repositories/stock_movement_repository.dart';
import '../sync_handler.dart';

/// Pushes stock-in/out movements through Fulus Cloud. Sale movements remain
/// server-derived. Absolute adjustment is rejected rather than converted to
/// a stale local delta; the server must own that calculation.
class StockMovementSyncHandler implements SyncHandler {
  StockMovementSyncHandler({
    required AppDatabase db,
    required FulusSyncApi fulusSyncApi,
    required FulusConnectionState fulusConnectionState,
    required StockMovementRepository stockMovementRepository,
    required ProductRepository productRepository,
  })  : _db = db,
        _fulusSyncApi = fulusSyncApi,
        _fulusConnectionState = fulusConnectionState,
        _stockMovementRepository = stockMovementRepository,
        _productRepository = productRepository;

  final AppDatabase _db;
  final FulusSyncApi _fulusSyncApi;
  final FulusConnectionState _fulusConnectionState;
  final StockMovementRepository _stockMovementRepository;
  final ProductRepository _productRepository;

  @override
  Future<void> sync(SyncQueueItem item) async {
    if (item.operation != 'create') throw StateError('StockMovementSyncHandler supports only create.');
    final movement = await _stockMovementRepository.getStockMovementById(item.entityLocalId);
    if (movement == null) throw StateError('No local stock movement found for ${item.entityLocalId}.');
    if (movement.serverId?.isNotEmpty == true) return;
    if (movement.movementType == StockMovementType.sale) {
      throw StateError('Sale stock movements are created by the server sale transaction.');
    }
    if (movement.movementType == StockMovementType.transfer) {
      throw StateError('Stock transfers are not supported by the Fulus Cloud command API yet.');
    }
    if (movement.movementType == StockMovementType.adjustment) {
      throw StateError('Absolute stock adjustments require a server-side absolute-adjustment command; refusing to submit a stale local delta.');
    }

    final businessId = _fulusConnectionState.selectedBusinessId;
    final device = _fulusConnectionState.registeredDevice;
    if (businessId == null || businessId.isEmpty || device?.status != 'active') {
      throw StateError('Fulus Cloud device authorization is required for stock sync.');
    }
    final product = await (_db.select(_db.products)
          ..where((p) => p.localId.equals(movement.productLocalId)))
        .getSingleOrNull();
    final productId = product?.serverId;
    if (productId == null || productId.isEmpty) throw StateError('Stock movement product has no server identity yet.');
    final location = await (_db.select(_db.locations)
          ..where((l) => l.localId.equals(movement.locationId)))
        .getSingleOrNull();
    final locationId = location?.serverId;
    if (locationId == null || locationId.isEmpty) throw StateError('Stock movement location has no server identity yet.');

    final quantity = movement.quantity;
    if (quantity == null || quantity <= 0) throw StateError('Stock movement quantity must be positive.');
    final delta = movement.movementType == StockMovementType.stockIn ? quantity : -quantity;
    final result = await _fulusSyncApi.submitOperation(
      businessId: businessId,
      operationType: 'stock_movement.create',
      operationId: item.id,
      deviceClientId: device!.deviceClientId,
      clientReference: movement.localId,
      payload: {
        'business_id': businessId,
        'product_id': productId,
        'location_id': locationId,
        'quantity_delta': delta,
        'reason': movement.reason ?? 'Stock movement',
        'operation_id': item.id,
      },
    );
    final data = result['data'];
    if (data is! Map) throw StateError('Fulus stock sync returned no response data.');
    final currentStock = (data['current_stock'] as num?)?.toInt();
    if (currentStock != null) {
      await _productRepository.reconcileStockLevel(
        productLocalId: movement.productLocalId,
        locationId: movement.locationId,
        currentStock: currentStock,
      );
    }
    await _stockMovementRepository.markSettled(localId: movement.localId);
  }
}
''')

          bootstrap = Path('lib/app/bootstrap.dart')
          text = bootstrap.read_text()
          text = text.replace(
              "final locationSyncHandler = LocationSyncHandler(locationsApi: locationsApi, locationRepository: locationRepository);",
              "final locationSyncHandler = LocationSyncHandler(locationsApi: locationsApi, locationRepository: locationRepository);",
          )
          text = text.replace(
              "final returnSyncHandler = ReturnSyncHandler(returnsApi: returnsApi, returnRepository: returnRepository);",
              "final returnSyncHandler = ReturnSyncHandler(db: database, fulusSyncApi: fulusSyncApi, fulusConnectionState: fulusConnectionState, returnRepository: returnRepository);",
          )
          text = text.replace(
              "final expenseSyncHandler = ExpenseSyncHandler(expensesApi: expensesApi, expenseRepository: expenseRepository);",
              "final expenseSyncHandler = ExpenseSyncHandler(db: database, fulusSyncApi: fulusSyncApi, fulusConnectionState: fulusConnectionState, expenseRepository: expenseRepository);",
          )
          text = text.replace(
              "final stockMovementSyncHandler = StockMovementSyncHandler(db: database, stockMovementsApi: stockMovementsApi, stockMovementRepository: stockMovementRepository, productRepository: productRepository);",
              "final stockMovementSyncHandler = StockMovementSyncHandler(db: database, fulusSyncApi: fulusSyncApi, fulusConnectionState: fulusConnectionState, stockMovementRepository: stockMovementRepository, productRepository: productRepository);",
          )
          bootstrap.write_text(text)

      - name: Verify
        run: |
          git diff --check
          flutter --version
          flutter pub get
          dart run build_runner build
          flutter analyze --fatal-infos

      - name: Commit implementation
        shell: bash
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add lib/sync/handlers/expense_sync_handler.dart lib/sync/handlers/return_sync_handler.dart lib/sync/handlers/stock_movement_sync_handler.dart lib/app/bootstrap.dart lib/data/remote/fulus_sync_api.dart lib/data/remote/fulus_sync_coordinator.dart lib/sync/handlers/customer_ledger_sync_handler.dart lib/data/remote/fulus_connection_state.dart lib/app/providers.dart test/sync/customer_sync_handler_test.dart .github/workflows/ci-hotfix.yml
          git diff --cached --quiet && exit 0
          git commit -m 'feat: harden Fulus Cloud sync transport'
          git push
