name: Temporary Dart analyzer fix

on:
  push:
    branches:
      - ui/reference-convergence-pass-a

permissions:
  contents: write

jobs:
  fix:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          ref: ui/reference-convergence-pass-a
      - name: Setup Flutter
        uses: subosito/flutter-action@v2
        with:
          flutter-version: "3.44.9"
          channel: stable
          cache: true
      - name: Resolve dependencies
        run: flutter pub get
      - name: Apply Dart analyzer fixes
        run: dart fix --apply
      - name: Commit analyzer fixes
        run: |
          if git diff --quiet; then
            echo "No analyzer fixes to commit."
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git commit -m "fix: clean Dart analyzer diagnostics"
          git push origin HEAD:ui/reference-convergence-pass-a
