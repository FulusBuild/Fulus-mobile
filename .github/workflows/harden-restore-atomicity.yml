name: Harden restore deletion order

on:
  push:
    branches:
      - phase-11-cloud-restore-on-reinstall

permissions:
  contents: write

jobs:
  harden:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Fix restore deletion order
        run: |
          sed -i "/^[[:space:]]*'users',[[:space:]]*$/d" lib/data/remote/cloud_restore_importer.dart
          sed -i "/^[[:space:]]*'audit_logs',[[:space:]]*$/a\\    'users'," lib/data/remote/cloud_restore_importer.dart
          git diff --check
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add lib/data/remote/cloud_restore_importer.dart
          if git diff --cached --quiet; then exit 0; fi
          git commit -m 'fix(restore): delete users after dependent records'
          git push
