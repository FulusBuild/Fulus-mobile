name: Fulus Runtime & Production Evidence

on:
  workflow_dispatch:

permissions:
  contents: read
  actions: read

# Avoid cancelling an active evidence run; a newer manual dispatch may
# replace only a pending evidence run, never a production deployment.
concurrency:
  group: fulus-runtime-production-evidence
  cancel-in-progress: false

env:
  FLUTTER_VERSION: "3.44.9"
  SUPABASE_URL: "https://bejcuvoxemwomcatgyxz.supabase.co"
  SUPABASE_PUBLISHABLE_KEY: "sb_publishable_POaHTyngxKH1wEfo9q7v2Q_ddDPrI80"

jobs:
  money-contract:
    name: Money boundary contract
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: subosito/flutter-action@v2
        with:
          flutter-version: ${{ env.FLUTTER_VERSION }}
          channel: stable
          cache: true
      - run: flutter pub get
      - name: Run focused money contract tests
        run: |
          flutter test \
            test/core/money/money_test.dart \
            test/core/money/money_wire_contract_fitness_test.dart

  live-auth-contract:
    name: Live account creation contract
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: subosito/flutter-action@v2
        with:
          flutter-version: ${{ env.FLUTTER_VERSION }}
          channel: stable
          cache: true
      - run: flutter pub get
      - name: Run live signup contract
        env:
          SUPABASE_URL: ${{ env.SUPABASE_URL }}
          SUPABASE_PUBLISHABLE_KEY: ${{ env.SUPABASE_PUBLISHABLE_KEY }}
        run: dart run tool/fulus_auth_e2e.dart

  production-deployment-preflight:
    name: Ensure production deployment is idle before live evidence
    runs-on: ubuntu-latest
    timeout-minutes: 3
    steps:
      - name: Check production deployment workflow
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          runs="$(gh api \
            -H 'Accept: application/vnd.github+json' \
            -H 'X-GitHub-Api-Version: 2026-03-10' \
            "/repos/${GITHUB_REPOSITORY}/actions/workflows/supabase-production-migrations.yml/runs?per_page=20")"
          active="$(jq '[.workflow_runs[] | select(.status == "queued" or .status == "in_progress" or .status == "waiting" or .status == "requested" or .status == "pending")] | length' <<<"$runs")"
          if [ "$active" -gt 0 ]; then
            echo "::error::A production migration/deployment run is active or queued. Wait for it to finish, then rerun runtime evidence."
            exit 1
          fi
          echo "No active production migration/deployment run found."

  live-sync-contract:
    name: Live sync contract
    needs: production-deployment-preflight
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: subosito/flutter-action@v2
        with:
          flutter-version: ${{ env.FLUTTER_VERSION }}
          channel: stable
          cache: true
      - run: flutter pub get
      - name: Run live sync contract
        env:
          FULUS_API_URL: ${{ secrets.FULUS_E2E_API_URL }}
          FULUS_E2E_EMAIL: ${{ secrets.FULUS_E2E_EMAIL }}
          FULUS_E2E_PASSWORD: ${{ secrets.FULUS_E2E_PASSWORD }}
          FULUS_AUTH_URL: ${{ env.SUPABASE_URL }}
          FULUS_PUBLISHABLE_KEY: ${{ env.SUPABASE_PUBLISHABLE_KEY }}
          FULUS_BUSINESS_ID: ${{ secrets.FULUS_E2E_BUSINESS_ID }}
          FULUS_DEVICE_ID: ${{ secrets.FULUS_E2E_DEVICE_ID }}
        run: dart run tool/fulus_sync_e2e.dart

  live-multi-device:
    name: Live multi-device convergence
    needs: live-sync-contract
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: subosito/flutter-action@v2
        with:
          flutter-version: ${{ env.FLUTTER_VERSION }}
          channel: stable
          cache: true
      - run: flutter pub get
      - name: Run live multi-device convergence
        env:
          FULUS_API_URL: ${{ secrets.FULUS_E2E_API_URL }}
          FULUS_E2E_EMAIL: ${{ secrets.FULUS_E2E_EMAIL }}
          FULUS_E2E_PASSWORD: ${{ secrets.FULUS_E2E_PASSWORD }}
          FULUS_AUTH_URL: ${{ env.SUPABASE_URL }}
          FULUS_PUBLISHABLE_KEY: ${{ env.SUPABASE_PUBLISHABLE_KEY }}
          FULUS_BUSINESS_ID: ${{ secrets.FULUS_E2E_BUSINESS_ID }}
          FULUS_DEVICE_ID: ${{ secrets.FULUS_E2E_DEVICE_ID }}
        run: dart run tool/fulus_multi_device_e2e.dart

  production-migration-history:
    name: Production migration history
    environment: Production
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - name: Install jq
        run: sudo apt-get update && sudo apt-get install -y jq
      - name: Verify production migration history
        env:
          SUPABASE_ACCESS_TOKEN: ${{ secrets.SUPABASE_ACCESS_TOKEN }}
          SUPABASE_PROJECT_ID: ${{ secrets.SUPABASE_PROJECT_ID }}
        run: bash tool/verify_supabase_migration_history.sh

