name: Riverpod-only bump check

on:
  workflow_dispatch:

jobs:
  check:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: subosito/flutter-action@v2
        with:
          flutter-version: "3.44.9"
          channel: stable

      # Actually applies it on this runner only. Nothing is committed
      # back to the repo — pubspec.yaml/pubspec.lock changes die with
      # the runner.
      - name: Apply the scoped bump
        run: |
          flutter pub upgrade --major-versions \
            flutter_riverpod riverpod_annotation riverpod_generator \
            freezed freezed_annotation sqlite3 sqlite3_flutter_libs
          grep -nE "flutter_riverpod:|riverpod_annotation:|riverpod_generator:|freezed:|freezed_annotation:|sqlite3:|sqlite3_flutter_libs:" pubspec.yaml

      - name: Try code generation against this narrower dependency set
        run: dart run build_runner build --delete-conflicting-outputs

      # This is the real test: codegen not crashing doesn't mean your
      # hand-written code still compiles against the new Riverpod/
      # freezed/sqlite3 APIs. This mirrors the real "analyze" job.
      - name: Analyze against the narrower dependency set
        run: flutter analyze --fatal-infos
