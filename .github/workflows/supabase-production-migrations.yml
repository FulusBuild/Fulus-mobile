name: Fulus Production Supabase Migrations

on:
  push:
    branches:
      - main
    paths:
      - "supabase/migrations/**"
      - "supabase/config.toml"
      - "supabase/functions/**"
      - ".github/workflows/supabase-production-migrations.yml"
  workflow_dispatch:

permissions:
  contents: read
  actions: read

concurrency:
  group: fulus-production-supabase-migrations
  cancel-in-progress: false

jobs:
  deploy:
    name: Verify and deploy production migrations
    runs-on: ubuntu-latest
    timeout-minutes: 30
    environment: production
    env:
      SUPABASE_ACCESS_TOKEN: ${{ secrets.SUPABASE_ACCESS_TOKEN }}
      SUPABASE_DB_PASSWORD: ${{ secrets.SUPABASE_DB_PASSWORD }}
      SUPABASE_PROJECT_ID: ${{ secrets.SUPABASE_PROJECT_ID }}
    steps:
      - name: Checkout
        uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2

      - name: Validate deployment secrets
        run: |
          set -euo pipefail
          for name in SUPABASE_ACCESS_TOKEN SUPABASE_DB_PASSWORD SUPABASE_PROJECT_ID; do
            if [ -z "${!name:-}" ]; then
              echo "::error::Missing required production Supabase secret: $name"
              exit 1
            fi
          done

      - name: Setup Supabase CLI
        uses: supabase/setup-cli@3c2f5e2ae34c34e428e8e206e2c4d21fa2d20fb # v2.1.1
        with:
          version: 2.117.0

      - name: Gate production deployment on mobile and cloud-sync CI
        env:
          GH_TOKEN: ${{ github.token }}
          COMMIT_SHA: ${{ github.sha }}
        run: |
          set -euo pipefail
          echo "Waiting for Fulus Mobile CI on $COMMIT_SHA"
          for attempt in $(seq 1 60); do
            runs="$(gh api \
              -H 'Accept: application/vnd.github+json' \
              -H 'X-GitHub-Api-Version: 2026-03-10' \
              "/repos/${GITHUB_REPOSITORY}/actions/workflows/ci.yml/runs?head_sha=${COMMIT_SHA}&per_page=20")"
            run_count="$(jq '.total_count' <<<"$runs")"
            if [ "$run_count" -gt 0 ]; then
              conclusion="$(jq -r '[.workflow_runs[] | select(.head_sha == "'$COMMIT_SHA'")] | sort_by(.created_at) | last | .conclusion // empty' <<<"$runs")"
              status="$(jq -r '[.workflow_runs[] | select(.head_sha == "'$COMMIT_SHA'")] | sort_by(.created_at) | last | .status // empty' <<<"$runs")"
              echo "CI status=$status conclusion=$conclusion"
              case "$conclusion" in
                success) exit 0 ;;
                failure|cancelled|timed_out|action_required|stale)
                  echo "::error::Fulus Mobile CI did not pass for this production commit."
                  exit 1
                  ;;
              esac
            fi
            sleep 30
          done
          echo "::error::Timed out waiting for Fulus Mobile CI for this exact commit."
          exit 1
      - name: Link production project
        run: supabase link --project-ref "$SUPABASE_PROJECT_ID" --password "$SUPABASE_DB_PASSWORD"

      - name: Verify exact production migration history
        run: bash tool/verify_supabase_migration_history.sh

      - name: Preview production migration
        run: supabase db push --dry-run

      - name: Apply production migrations
        run: supabase db push

      - name: Verify migration history after deployment
        run: bash tool/verify_supabase_migration_history.sh

      # Keep production Edge Functions on the same reviewed main SHA as the
      # migrations. Deploy only after the migration step and re-check the
      # repository/production migration boundary before touching functions.
      - name: Deploy production Edge Functions
        run: |
          set -euo pipefail
          for function in \
            fulus-api \
            fulus-sync-state \
            fulus-restore \
            fulus-provision-business \
            fulus-staff-api \
            fulus-reporting-api \
            fulus-diagnostics; do
            echo "Deploying $function"
            supabase functions deploy "$function" --project-ref "$SUPABASE_PROJECT_ID"
          done

      - name: Verify production migration history after function deployment
        run: bash tool/verify_supabase_migration_history.sh
