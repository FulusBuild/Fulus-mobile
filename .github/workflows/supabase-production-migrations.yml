name: Fulus Production Supabase Migrations
# Production verification: post-deploy live E2E is part of the deployment contract.

# Deployment is commit-exact and is intentionally gated on the full CI workflow.
# Live sync/convergence E2E runs after migrations and Edge Functions are deployed.

on:
  push:
    branches:
      - main
    paths:
      - "supabase/migrations/**"
      - "supabase/config.toml"
      - "supabase/functions/**"
  workflow_dispatch:

permissions:
  contents: read
  actions: read

# Serialize production deployments and live runtime-evidence runs. Never cancel
# an active migration/function deployment: if main advances, let the active
# commit finish and then run the newest pending commit against the latest state.
concurrency:
  group: fulus-production-supabase-migrations
  cancel-in-progress: false

jobs:
  deploy:
    name: Verify and deploy production migrations
    runs-on: ubuntu-latest
    timeout-minutes: 45
    environment: production
    env:
      SUPABASE_ACCESS_TOKEN: ${{ secrets.SUPABASE_ACCESS_TOKEN }}
      SUPABASE_DB_PASSWORD: ${{ secrets.SUPABASE_DB_PASSWORD }}
      SUPABASE_PROJECT_ID: ${{ secrets.SUPABASE_PROJECT_ID }}
    steps:
      - name: Checkout
        uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2

      - name: Restrict manual production deployment to main
        if: github.event_name == 'workflow_dispatch'
        env:
          EVENT_REF: ${{ github.ref }}
        run: |
          set -euo pipefail
          if [ "$EVENT_REF" != "refs/heads/main" ]; then
            echo "::error::Manual production migrations/deployment may only be dispatched from main."
            exit 1
          fi

      - name: Validate deployment secrets
        run: |
          set -euo pipefail
          for name in SUPABASE_ACCESS_TOKEN SUPABASE_DB_PASSWORD SUPABASE_PROJECT_ID; do
            if [ -z "${!name:-}" ]; then
              echo "::error::Missing required production Supabase secret: $name"
              exit 1
            fi
          done

      - name: Setup Supabase CLI
        uses: supabase/setup-cli@3c2f5e2ae34c34e428e8e206e2c4d21fa2d20fbf # v2.1.1
        with:
          version: 2.117.0

      - name: Setup Flutter
        uses: subosito/flutter-action@1a449444c387b1966244ae4d4f8c696479add0b2 # v2
        with:
          flutter-version: "3.44.9"
          channel: stable
          cache: true

      - name: Gate production deployment on exact-commit CI and migration-chain tests
        env:
          GH_TOKEN: ${{ github.token }}
          COMMIT_SHA: ${{ github.sha }}
        run: |
          set -euo pipefail
          echo "Waiting for Fulus Mobile CI and Supabase Migration Chain on $COMMIT_SHA"
          for attempt in $(seq 1 40); do
            ci_runs="$(gh api \
              -H 'Accept: application/vnd.github+json' \
              -H 'X-GitHub-Api-Version: 2026-03-10' \
              "/repos/${GITHUB_REPOSITORY}/actions/workflows/ci.yml/runs?head_sha=${COMMIT_SHA}&per_page=20")"
            migration_runs="$(gh api \
              -H 'Accept: application/vnd.github+json' \
              -H 'X-GitHub-Api-Version: 2026-03-10' \
              "/repos/${GITHUB_REPOSITORY}/actions/workflows/supabase-migrations.yml/runs?head_sha=${COMMIT_SHA}&per_page=20")"

            ci_count="$(jq --arg sha "$COMMIT_SHA" '[.workflow_runs[] | select(.head_sha == $sha and .event == "push")] | length' <<<"$ci_runs")"
            migration_push_count="$(jq --arg sha "$COMMIT_SHA" '[.workflow_runs[] | select(.head_sha == $sha and .event == "push")] | length' <<<"$migration_runs")"
            if [ "$migration_push_count" -gt 0 ]; then
              migration_event="push"
            else
              migration_event="workflow_dispatch"
            fi
            migration_count="$(jq --arg sha "$COMMIT_SHA" --arg event "$migration_event" '[.workflow_runs[] | select(.head_sha == $sha and .event == $event)] | length' <<<"$migration_runs")"

            if [ "$ci_count" -gt 0 ]; then
              ci_conclusion="$(jq -r --arg sha "$COMMIT_SHA" '[.workflow_runs[] | select(.head_sha == $sha and .event == "push")] | sort_by(.created_at) | last | .conclusion // empty' <<<"$ci_runs")"
              ci_status="$(jq -r --arg sha "$COMMIT_SHA" '[.workflow_runs[] | select(.head_sha == $sha and .event == "push")] | sort_by(.created_at) | last | .status // empty' <<<"$ci_runs")"
              echo "Fulus Mobile CI status=$ci_status conclusion=$ci_conclusion"
              case "$ci_conclusion" in
                failure|cancelled|timed_out|action_required|stale)
                  echo "::error::Fulus Mobile CI did not pass for this production commit."
                  exit 1
                  ;;
              esac
            else
              ci_conclusion=""
            fi

            if [ "$migration_count" -gt 0 ]; then
              migration_conclusion="$(jq -r --arg sha "$COMMIT_SHA" --arg event "$migration_event" '[.workflow_runs[] | select(.head_sha == $sha and .event == $event)] | sort_by(.created_at) | last | .conclusion // empty' <<<"$migration_runs")"
              migration_status="$(jq -r --arg sha "$COMMIT_SHA" --arg event "$migration_event" '[.workflow_runs[] | select(.head_sha == $sha and .event == $event)] | sort_by(.created_at) | last | .status // empty' <<<"$migration_runs")"
              echo "Supabase Migration Chain status=$migration_status conclusion=$migration_conclusion"
              case "$migration_conclusion" in
                failure|cancelled|timed_out|action_required|stale)
                  echo "::error::Fulus Supabase Migration Chain did not pass for this production commit."
                  exit 1
                  ;;
              esac
            else
              migration_conclusion=""
            fi

            if [ "$ci_conclusion" = "success" ] && [ "$migration_conclusion" = "success" ]; then
              echo "Both exact-commit CI gates passed."
              exit 0
            fi
            sleep 30
          done
          echo "::error::Timed out waiting for exact-commit CI and Supabase Migration Chain results."
          exit 1

      - name: Diagnose Supabase Management API authentication
        run: |
          set -euo pipefail
          endpoint="https://api.supabase.com/v1/projects/${SUPABASE_PROJECT_ID}"
          http_status="$(curl -sS -o /dev/null -w '%{http_code}' --connect-timeout 10 --max-time 30 \
            -H "Authorization: Bearer ${SUPABASE_ACCESS_TOKEN}" \
            -H 'Accept: application/json' \
            "$endpoint")"
          case "$http_status" in
            200)
              echo "Supabase Management API authentication succeeded for the configured project."
              ;;
            401)
              echo "::error::Supabase Management API rejected SUPABASE_ACCESS_TOKEN (HTTP 401 Unauthorized). Check that the production secret contains a valid, unexpired PAT."
              exit 1
              ;;
            403)
              echo "::error::Supabase Management API authenticated the token but denied access to the configured project (HTTP 403 Forbidden). Check project access and PAT scopes."
              exit 1
              ;;
            429)
              echo "::error::Supabase Management API rate-limited the authentication diagnostic (HTTP 429)."
              exit 1
              ;;
            *)
              echo "::error::Supabase Management API authentication diagnostic returned unexpected HTTP status: $http_status"
              exit 1
              ;;
          esac

      - name: Link production project
        run: supabase link --project-ref "$SUPABASE_PROJECT_ID" --password "$SUPABASE_DB_PASSWORD"

      - name: Repair known legacy production migration history
        run: bash tool/repair_supabase_migration_history.sh

      - name: Verify exact production migration history
        run: bash tool/verify_supabase_migration_history.sh

      - name: Preview production migration
        run: supabase db push --dry-run

      - name: Apply production migrations
        run: supabase db push

      - name: Verify migration history after deployment
        run: bash tool/verify_supabase_migration_history.sh

      - name: Verify production schema matches repository migrations
        run: |
          set -euo pipefail
          rm -f /tmp/production-schema-diff.sql
          supabase db diff --linked --schema public -o /tmp/production-schema-diff.sql
          if [ -s /tmp/production-schema-diff.sql ]; then
            echo "::error::Production public schema differs from the repository migration result."
            cat /tmp/production-schema-diff.sql
            exit 1
          fi
          echo "Production public schema matches the repository migration chain."

      # Keep production Edge Functions on the same reviewed main SHA as the
      # migrations. Deploy only after the migration step and re-check the
      # repository/production migration boundary before touching functions.
      - name: Deploy production Edge Functions
        run: |
          set -euo pipefail
          for function in \
            fulus-api \
            fulus-sync-state \
            fulus-restore \
            fulus-provision-business \
            fulus-staff-api \
            fulus-reporting-api \
            fulus-diagnostics; do
            echo "Deploying $function"
            supabase functions deploy "$function" --project-ref "$SUPABASE_PROJECT_ID"
          done

      - name: Post-deploy live sync contract test
        env:
          FULUS_API_URL: ${{ secrets.FULUS_E2E_API_URL }}
          FULUS_E2E_EMAIL: ${{ secrets.FULUS_E2E_EMAIL }}
          FULUS_E2E_PASSWORD: ${{ secrets.FULUS_E2E_PASSWORD }}
          FULUS_AUTH_URL: https://bejcuvoxemwomcatgyxz.supabase.co
          FULUS_PUBLISHABLE_KEY: sb_publishable_POaHTyngxKH1wEfo9q7v2Q_ddDPrI80
          FULUS_BUSINESS_ID: ${{ secrets.FULUS_E2E_BUSINESS_ID }}
          FULUS_DEVICE_ID: ${{ secrets.FULUS_E2E_DEVICE_ID }}
        run: |
          set -euo pipefail
          for name in FULUS_API_URL FULUS_E2E_EMAIL FULUS_E2E_PASSWORD FULUS_BUSINESS_ID FULUS_DEVICE_ID; do
            if [ -z "${!name:-}" ]; then
              echo "::error::Missing required live E2E secret: $name"
              exit 1
            fi
          done
          echo "Running post-deploy live sync contract test against production."
          flutter pub get
          dart run tool/fulus_sync_e2e.dart

      - name: Post-deploy multi-device convergence test
        env:
          FULUS_API_URL: ${{ secrets.FULUS_E2E_API_URL }}
          FULUS_E2E_EMAIL: ${{ secrets.FULUS_E2E_EMAIL }}
          FULUS_E2E_PASSWORD: ${{ secrets.FULUS_E2E_PASSWORD }}
          FULUS_AUTH_URL: https://bejcuvoxemwomcatgyxz.supabase.co
          FULUS_PUBLISHABLE_KEY: sb_publishable_POaHTyngxKH1wEfo9q7v2Q_ddDPrI80
          FULUS_BUSINESS_ID: ${{ secrets.FULUS_E2E_BUSINESS_ID }}
          FULUS_DEVICE_ID: ${{ secrets.FULUS_E2E_DEVICE_ID }}
        run: |
          set -euo pipefail
          echo "Running post-deploy multi-device convergence test against production."
          dart run tool/fulus_multi_device_e2e.dart

      - name: Verify production migration history after function deployment
        run: bash tool/verify_supabase_migration_history.sh
