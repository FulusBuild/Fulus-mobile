name: ShellGate Diagnostic APK

on:
  push:
    branches:
      - diagnostic-shellgate

permissions:
  contents: read

env:
  FLUTTER_VERSION: "3.44.9"

jobs:
  diagnostic_apk:
    name: Build ShellGate diagnostic APK
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Flutter
        uses: subosito/flutter-action@v2
        with:
          flutter-version: ${{ env.FLUTTER_VERSION }}
          channel: stable
          cache: true

      - name: Setup Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - name: Flutter pub get
        run: flutter pub get

      - name: Generate code
        run: dart run build_runner build --delete-conflicting-outputs

      - name: Patch ShellGate for diagnostics
        run: |
          python3 - <<'PY'
          from pathlib import Path

          path = Path("lib/app/router.dart")
          text = path.read_text()

          old = """      builder: (context, snapshot) {\n        if (!snapshot.hasData) {\n          return const FulusScreen(body: FulusLoadingIndicator());\n        }\n"""

          new = """      builder: (context, snapshot) {\n        if (snapshot.hasError) {\n          return FulusScreen(\n            title: 'Fulus could not start',\n            body: Center(\n              child: Padding(\n                padding: const EdgeInsets.all(24),\n                child: Column(\n                  mainAxisSize: MainAxisSize.min,\n                  children: [\n                    const Icon(Icons.error_outline, size: 48),\n                    const SizedBox(height: 16),\n                    const Text(\n                      'We could not load your business data.',\n                      textAlign: TextAlign.center,\n                    ),\n                    const SizedBox(height: 8),\n                    SelectableText(\n                      snapshot.error.toString(),\n                      textAlign: TextAlign.center,\n                    ),\n                    const SizedBox(height: 24),\n                    FilledButton(\n                      onPressed: () {\n                        setState(() {\n                          _futureBuiltForUser = null;\n                          _businessConfiguredFuture = null;\n                        });\n                      },\n                      child: const Text('Retry'),\n                    ),\n                  ],\n                ),\n              ),\n            ),\n          );\n        }\n        if (!snapshot.hasData) {\n          return const FulusScreen(body: FulusLoadingIndicator());\n        }\n"""

          if old not in text:
              raise SystemExit("Expected ShellGate FutureBuilder block was not found; refusing to modify the build.")

          path.write_text(text.replace(old, new, 1))
          print("ShellGate diagnostic patch applied")
          PY

      - name: Disable production signing guard for debug diagnostic build
        run: |
          python3 - <<'PY'
          from pathlib import Path

          path = Path("android/app/build.gradle")
          text = path.read_text()
          old = '''            if (!keystorePropertiesFile.exists()) {\n                throw new GradleException(\n                    "Release signing is not configured. Provide android/key.properties from key.properties.example."\n                )\n            }\n'''
          if old not in text:
              raise SystemExit("Expected release signing guard was not found; refusing to modify the build.")
          path.write_text(text.replace(old, "", 1))
          print("Production signing guard disabled for this CI workspace only")
          PY

      - name: Build diagnostic APK
        run: flutter build apk --debug

      - name: Upload diagnostic APK
        uses: actions/upload-artifact@v4
        with:
          name: fulus-shellgate-diagnostic-apk-${{ github.run_number }}
          path: build/app/outputs/flutter-apk/app-debug.apk
          if-no-files-found: error
          retention-days: 7
