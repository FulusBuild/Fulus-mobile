name: Fulus Supabase Migration Chain

on:
  push:
    branches:
      - main
    paths:
      - "supabase/migrations/**"
      - "supabase/config.toml"
      - "supabase/tests/**"
  pull_request:
    branches:
      - main
    paths:
      - "supabase/migrations/**"
      - "supabase/config.toml"
      - "supabase/tests/**"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  reset:
    name: Rebuild Supabase schema from zero
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Supabase CLI
        uses: supabase/setup-cli@v1
        with:
          version: latest

      - name: Start local Supabase
        run: supabase start

      - name: Reset local database from repository migrations
        run: supabase db reset

      - name: Restart local Supabase after reset
        run: supabase start

      - name: Wait for local Postgres after reset
        shell: bash
        run: |
          set -euo pipefail
          for attempt in {1..30}; do
            if pg_isready -h 127.0.0.1 -p 54322 -U postgres >/dev/null 2>&1; then
              echo "Local Postgres is ready."
              exit 0
            fi
            sleep 2
          done
          echo "::error::Local Postgres did not become ready after supabase db reset."
          exit 1

      - name: Run location authorization adversarial tests
        run: psql "postgresql://postgres:postgres@127.0.0.1:54322/postgres" -v ON_ERROR_STOP=1 -f supabase/tests/location_authorization.sql

      - name: Show migration status
        run: supabase migration list --local
