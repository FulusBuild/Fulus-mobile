name: Fulus Supabase Migration Chain

on:
  push:
    branches:
      - main
    paths:
      - "supabase/migrations/**"
      - "supabase/config.toml"
      - "supabase/tests/**"
  pull_request:
    branches:
      - main
    paths:
      - "supabase/migrations/**"
      - "supabase/config.toml"
      - "supabase/tests/**"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  reset:
    name: Rebuild Supabase schema from zero
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - name: Checkout
        uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2

      - name: Setup Supabase CLI
        uses: supabase/setup-cli@3c2f5e2ae34c34e428e8e206e2c4d21fa2d20fbf # v2.1.1
        with:
          version: 2.117.0

      - name: Start local Supabase
        run: supabase start

      - name: Reset local database from repository migrations
        run: supabase db reset

      - name: Restart local Supabase after reset
        run: supabase start

      - name: Run location authorization adversarial tests
        shell: bash
        run: |
          set -euo pipefail
          db_url="$(supabase status -o env | sed -n 's/^DB_URL=//p' | tr -d '"')"
          test -n "$db_url"
          psql "$db_url" -v ON_ERROR_STOP=1 -f supabase/tests/location_authorization.sql

      - name: Show migration status
        run: supabase migration list --local
