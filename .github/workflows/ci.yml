name: Fulus Mobile CI

on:
  push:
    branches:
      - main
      - develop
      - backend/phase-1-catalog
      - backend/phase-4-foundation-v2
      - phase-7-consumer-polish
      - phase-9-production-hardening

  pull_request:
    branches:
      - main
      - develop
      - backend/phase-1-catalog
      - backend/phase-4-foundation-v2
      - phase-7-consumer-polish
      - phase-9-production-hardening

  workflow_dispatch:
    inputs:
      build_apk:
        description: "Build and upload an APK"
        required: true
        default: "none"
        type: choice
        options:
          - none
          - debug

      run_fulus_e2e:
        description: "Run the live Fulus sync contract test (requires FULUS_E2E_* secrets)"
        required: true
        default: "false"
        type: boolean

env:
  FLUTTER_VERSION: "3.44.9"

# A branch push and its pull-request run must share the same group. Otherwise
# github.ref differs (refs/heads/... vs refs/pull/.../merge), allowing both
# runs to execute even though they validate the same branch state.
concurrency:
  group: fulus-mobile-ci-${{ github.workflow }}-${{ github.head_ref || github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  dependencies:
    name: Resolve dependencies
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Setup Flutter
        uses: subosito/flutter-action@v2
        with:
          flutter-version: ${{ env.FLUTTER_VERSION }}
          channel: stable
          cache: true
      - name: Flutter version
        run: flutter --version
      - name: Resolve dependencies
        run: flutter pub get

  codegen:
    name: Generate Dart code
    needs: dependencies
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Setup Flutter
        uses: subosito/flutter-action@v2
        with:
          flutter-version: ${{ env.FLUTTER_VERSION }}
          channel: stable
          cache: true
      - name: Flutter pub get
        run: flutter pub get
      - name: Generate code
        run: dart run build_runner build --delete-conflicting-outputs

  analyze:
    name: Static analysis
    needs: codegen
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Setup Flutter
        uses: subosito/flutter-action@v2
        with:
          flutter-version: ${{ env.FLUTTER_VERSION }}
          channel: stable
          cache: true
      - name: Flutter pub get
        run: flutter pub get
      - name: Generate code
        run: dart run build_runner build --delete-conflicting-outputs
      - name: Analyze
        run: flutter analyze --fatal-infos

  test:
    name: Flutter tests
    needs: analyze
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Setup Flutter
        uses: subosito/flutter-action@v2
        with:
          flutter-version: ${{ env.FLUTTER_VERSION }}
          channel: stable
          cache: true
      - name: Flutter pub get
        run: flutter pub get
      - name: Generate code
        run: dart run build_runner build --delete-conflicting-outputs
      - name: Run tests
        run: flutter test

  fulus_e2e:
    name: Fulus live sync contract test
    needs: test
    if: github.event_name == 'workflow_dispatch' && inputs.run_fulus_e2e
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Setup Flutter
        uses: subosito/flutter-action@v2
        with:
          flutter-version: ${{ env.FLUTTER_VERSION }}
          channel: stable
          cache: true
      - name: Flutter pub get
        run: flutter pub get
      - name: Run Fulus sync contract test
        env:
          FULUS_API_URL: ${{ secrets.FULUS_E2E_API_URL }}
          FULUS_E2E_EMAIL: ${{ secrets.FULUS_E2E_EMAIL }}
          FULUS_E2E_PASSWORD: ${{ secrets.FULUS_E2E_PASSWORD }}
          FULUS_AUTH_URL: https://bejcuvoxemwomcatgyxz.supabase.co
          FULUS_PUBLISHABLE_KEY: sb_publishable_POaHTyngxKH1wEfo9q7v2Q_ddDPrI80
          FULUS_BUSINESS_ID: ${{ secrets.FULUS_E2E_BUSINESS_ID }}
          FULUS_DEVICE_ID: ${{ secrets.FULUS_E2E_DEVICE_ID }}
        run: dart run tool/fulus_sync_e2e.dart

  debug_apk:
    name: Build debug APK
    needs: test
    if: github.event_name == 'workflow_dispatch' && inputs.build_apk == 'debug'
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Setup Flutter
        uses: subosito/flutter-action@v2
        with:
          flutter-version: ${{ env.FLUTTER_VERSION }}
          channel: stable
          cache: true
      - name: Setup Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"
      - name: Flutter pub get
        run: flutter pub get
      - name: Generate code
        run: dart run build_runner build --delete-conflicting-outputs
      - name: Build debug APK
        run: flutter build apk --debug
      - name: Upload debug APK
        uses: actions/upload-artifact@v4
        with:
          name: fulus-mobile-debug-apk-${{ github.run_number }}
          path: build/app/outputs/flutter-apk/app-debug.apk
          if-no-files-found: error
          retention-days: 2
