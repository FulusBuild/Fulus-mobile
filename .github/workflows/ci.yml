name: Fulus Mobile CI

on:
  push:
    branches:
      - main
      - develop

  pull_request:
    branches:
      - main
      - develop

  workflow_dispatch:
    inputs:
      upload_debug_apk:
        description: "Upload the debug APK for device testing"
        required: false
        default: false
        type: boolean

      upload_release_apk:
        description: "Upload the release APK"
        required: false
        default: false
        type: boolean

env:
  FLUTTER_VERSION: "3.24.0"

permissions:
  contents: read

concurrency:
  group: fulus-ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:

  # ────────────────────────────────────────────────────────────────────────
  # 1. DEPENDENCIES
  # ────────────────────────────────────────────────────────────────────────

  dependencies:
    name: Resolve dependencies
    runs-on: ubuntu-latest
    timeout-minutes: 15

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Flutter
        uses: subosito/flutter-action@v2
        with:
          flutter-version: ${{ env.FLUTTER_VERSION }}
          channel: stable

      - name: Cache Pub packages
        uses: actions/cache@v4
        with:
          path: ~/.pub-cache
          key: pub-${{ runner.os }}-${{ hashFiles('**/pubspec.lock') }}
          restore-keys: |
            pub-${{ runner.os }}-

      - name: Resolve dependencies
        run: flutter pub get


  # ────────────────────────────────────────────────────────────────────────
  # 2. CODE GENERATION
  # ────────────────────────────────────────────────────────────────────────

  codegen:
    name: Code generation
    needs: dependencies
    runs-on: ubuntu-latest
    timeout-minutes: 15

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Flutter
        uses: subosito/flutter-action@v2
        with:
          flutter-version: ${{ env.FLUTTER_VERSION }}
          channel: stable

      - name: Cache Pub packages
        uses: actions/cache@v4
        with:
          path: ~/.pub-cache
          key: pub-${{ runner.os }}-${{ hashFiles('**/pubspec.lock') }}
          restore-keys: |
            pub-${{ runner.os }}-

      - name: Resolve dependencies
        run: flutter pub get

      - name: Generate Dart code
        run: dart run build_runner build --delete-conflicting-outputs


  # ────────────────────────────────────────────────────────────────────────
  # 3. STATIC ANALYSIS
  # ────────────────────────────────────────────────────────────────────────

  analyze:
    name: Flutter analyze
    needs: codegen
    runs-on: ubuntu-latest
    timeout-minutes: 15

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Flutter
        uses: subosito/flutter-action@v2
        with:
          flutter-version: ${{ env.FLUTTER_VERSION }}
          channel: stable

      - name: Cache Pub packages
        uses: actions/cache@v4
        with:
          path: ~/.pub-cache
          key: pub-${{ runner.os }}-${{ hashFiles('**/pubspec.lock') }}
          restore-keys: |
            pub-${{ runner.os }}-

      - name: Resolve dependencies
        run: flutter pub get

      - name: Generate Dart code
        run: dart run build_runner build --delete-conflicting-outputs

      - name: Analyze
        run: flutter analyze --fatal-infos


  # ────────────────────────────────────────────────────────────────────────
  # 4. TESTS
  # ────────────────────────────────────────────────────────────────────────

  test:
    name: Flutter tests
    needs: analyze
    runs-on: ubuntu-latest
    timeout-minutes: 20

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Flutter
        uses: subosito/flutter-action@v2
        with:
          flutter-version: ${{ env.FLUTTER_VERSION }}
          channel: stable

      - name: Cache Pub packages
        uses: actions/cache@v4
        with:
          path: ~/.pub-cache
          key: pub-${{ runner.os }}-${{ hashFiles('**/pubspec.lock') }}
          restore-keys: |
            pub-${{ runner.os }}-

      - name: Resolve dependencies
        run: flutter pub get

      - name: Generate Dart code
        run: dart run build_runner build --delete-conflicting-outputs

      - name: Run tests
        run: flutter test


  # ────────────────────────────────────────────────────────────────────────
  # 5. ANDROID DEBUG BUILD VERIFICATION
  #
  # This verifies the Android/Gradle project but DOES NOT store an APK.
  # ────────────────────────────────────────────────────────────────────────

  build_debug:
    name: Android debug build
    needs: test
    runs-on: ubuntu-latest
    timeout-minutes: 30

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Flutter
        uses: subosito/flutter-action@v2
        with:
          flutter-version: ${{ env.FLUTTER_VERSION }}
          channel: stable

      - name: Setup Java
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: "8.11.1"

      - name: Bootstrap Gradle wrapper
        run: |
          mkdir -p /tmp/gradle-wrapper-bootstrap
          cd /tmp/gradle-wrapper-bootstrap

          touch settings.gradle

          gradle wrapper --distribution-type all

          cp -v gradlew gradlew.bat "$GITHUB_WORKSPACE/android/"
          cp -v gradle/wrapper/gradle-wrapper.jar \
            "$GITHUB_WORKSPACE/android/gradle/wrapper/"

          chmod +x "$GITHUB_WORKSPACE/android/gradlew"

      - name: Cache Pub packages
        uses: actions/cache@v4
        with:
          path: ~/.pub-cache
          key: pub-${{ runner.os }}-${{ hashFiles('**/pubspec.lock') }}
          restore-keys: |
            pub-${{ runner.os }}-

      - name: Resolve dependencies
        run: flutter pub get

      - name: Generate Dart code
        run: dart run build_runner build --delete-conflicting-outputs

      - name: Build debug APK
        run: flutter build apk --debug

      # APK storage is opt-in.
      # Normal CI runs store NOTHING.
      - name: Upload debug APK
        if: github.event_name == 'workflow_dispatch' && inputs.upload_debug_apk == true
        uses: actions/upload-artifact@v4
        with:
          name: fulus-debug-apk-${{ github.run_number }}
          path: build/app/outputs/flutter-apk/app-debug.apk
          retention-days: 2


  # ────────────────────────────────────────────────────────────────────────
  # 6. RELEASE BUILD VERIFICATION
  #
  # Release builds run on pushes to main/develop and manual runs.
  # They are NOT run on pull requests to reduce CI cost.
  #
  # The APK is NOT stored unless explicitly requested.
  # ────────────────────────────────────────────────────────────────────────

  build_release:
    name: Android release build
    needs: test
    if: github.event_name != 'pull_request'
    runs-on: ubuntu-latest
    timeout-minutes: 35

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Flutter
        uses: subosito/flutter-action@v2
        with:
          flutter-version: ${{ env.FLUTTER_VERSION }}
          channel: stable

      - name: Setup Java
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: "8.11.1"

      - name: Bootstrap Gradle wrapper
        run: |
          mkdir -p /tmp/gradle-wrapper-bootstrap
          cd /tmp/gradle-wrapper-bootstrap

          touch settings.gradle

          gradle wrapper --distribution-type all

          cp -v gradlew gradlew.bat "$GITHUB_WORKSPACE/android/"
          cp -v gradle/wrapper/gradle-wrapper.jar \
            "$GITHUB_WORKSPACE/android/gradle/wrapper/"

          chmod +x "$GITHUB_WORKSPACE/android/gradlew"

      - name: Cache Pub packages
        uses: actions/cache@v4
        with:
          path: ~/.pub-cache
          key: pub-${{ runner.os }}-${{ hashFiles('**/pubspec.lock') }}
          restore-keys: |
            pub-${{ runner.os }}-

      - name: Resolve dependencies
        run: flutter pub get

      - name: Generate Dart code
        run: dart run build_runner build --delete-conflicting-outputs

      - name: Verify API configuration
        env:
          API_BASE_URL: ${{ vars.API_BASE_URL }}
        run: |
          if [ -z "$API_BASE_URL" ]; then
            echo "::error::API_BASE_URL is not configured."
            exit 1
          fi

          if [ "$API_BASE_URL" = "http://10.0.2.2:8000" ]; then
            echo "::error::API_BASE_URL still points to the emulator-only default."
            exit 1
          fi

      - name: Build release APK
        env:
          API_BASE_URL: ${{ vars.API_BASE_URL }}
        run: |
          flutter build apk --release \
            --dart-define=API_BASE_URL="$API_BASE_URL"

      # Release artifact storage is also opt-in.
      - name: Upload release APK
        if: github.event_name == 'workflow_dispatch' && inputs.upload_release_apk == true
        uses: actions/upload-artifact@v4
        with:
          name: fulus-release-apk-${{ github.run_number }}
          path: build/app/outputs/flutter-apk/app-release.apk
          retention-days: 3