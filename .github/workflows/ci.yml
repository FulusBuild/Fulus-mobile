name: Fulus Mobile CI

on:
  push:
    branches:
      - main
      - develop
      - backend/phase-1-catalog
      - backend/phase-4-foundation-v2
      - phase-7-consumer-polish
      - phase-9-production-hardening

  pull_request:
    branches:
      - main
      - develop
      - backend/phase-1-catalog
      - backend/phase-4-foundation-v2
      - phase-7-consumer-polish
      - phase-9-production-hardening

  workflow_dispatch:
    inputs:
      build_apk:
        description: "Build and upload an APK"
        required: true
        default: "none"
        type: choice
        options:
          - none
          - debug
          - release

      run_fulus_e2e:
        description: "Run the live Fulus sync contract test (requires FULUS_E2E_* secrets)"
        required: true
        default: "true"
        type: boolean

env:
  FLUTTER_VERSION: "3.44.9"

# A branch push and its pull-request run must share the same group. Otherwise
# github.ref differs (refs/heads/... vs refs/pull/.../merge), allowing both
# runs to execute even though they validate the same branch state.
concurrency:
  group: fulus-mobile-ci-${{ github.workflow }}-${{ github.head_ref || github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  migration-lint:
    name: Migration filename integrity
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Validate migration versions
        shell: bash
        run: |
          set -euo pipefail
          mapfile -t files < <(find supabase/migrations -maxdepth 1 -type f -name '*.sql' -printf '%f\n' | sort)
          if [ "${#files[@]}" -eq 0 ]; then
            echo "::error::No Supabase migration files found."
            exit 1
          fi
          versions=()
          for file in "${files[@]}"; do
            if [[ ! "$file" =~ ^[0-9]+_.+\.sql$ ]]; then
              echo "::error file=supabase/migrations/$file::Migration filename must begin with a numeric version followed by _."
              exit 1
            fi
            version="${file%%_*}"
            versions+=("$version")
          done
          duplicates="$(printf '%s\n' "${versions[@]}" | sort | uniq -d)"
          if [ -n "$duplicates" ]; then
            echo "::error::Duplicate Supabase migration version(s): $(echo "$duplicates" | tr '\n' ' ')"
            exit 1
          fi
          echo "Validated ${#files[@]} migration files with unique versions."

          required_tables=(
            categories suppliers products product_stock_levels
            customers sales sale_items sale_payments customer_ledger_entries
            inventory_movements returns return_items expenses cash_ledger
          )
          for table in "${required_tables[@]}"; do
            if ! grep -Eiq "create[[:space:]]+table([[:space:]]+if[[:space:]]+not[[:space:]]+exists)?[[:space:]]+public\\.$table[[:space:]]*\\(" supabase/migrations/*.sql; then
              echo "::error::No repository migration creates required core table public.$table."
              exit 1
            fi
          done
          echo "Validated core business-domain tables are reproducibly created by repository migrations."

  dependencies:
    name: Resolve dependencies
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Setup Flutter
        uses: subosito/flutter-action@v2
        with:
          flutter-version: ${{ env.FLUTTER_VERSION }}
          channel: stable
          cache: true
      - name: Flutter version
        run: flutter --version
      - name: Resolve dependencies
        run: flutter pub get

  codegen:
    name: Generate Dart code
    needs: dependencies
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Setup Flutter
        uses: subosito/flutter-action@v2
        with:
          flutter-version: ${{ env.FLUTTER_VERSION }}
          channel: stable
          cache: true
      - name: Flutter pub get
        run: flutter pub get
      - name: Generate code
        run: dart run build_runner build --delete-conflicting-outputs

  analyze:
    name: Static analysis
    needs: codegen
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Setup Flutter
        uses: subosito/flutter-action@v2
        with:
          flutter-version: ${{ env.FLUTTER_VERSION }}
          channel: stable
          cache: true
      - name: Flutter pub get
        run: flutter pub get
      - name: Generate code
        run: dart run build_runner build --delete-conflicting-outputs
      - name: Analyze
        run: flutter analyze --fatal-infos

  test:
    name: Flutter tests
    needs: analyze
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Setup Flutter
        uses: subosito/flutter-action@v2
        with:
          flutter-version: ${{ env.FLUTTER_VERSION }}
          channel: stable
          cache: true
      - name: Flutter pub get
        run: flutter pub get
      - name: Generate code
        run: dart run build_runner build --delete-conflicting-outputs
      - name: Run tests
        run: flutter test

  fulus_e2e:
    name: Fulus live sync contract test
    needs: test
    if: github.event_name == 'pull_request' || (github.event_name == 'workflow_dispatch' && inputs.run_fulus_e2e == true)
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Setup Flutter
        uses: subosito/flutter-action@v2
        with:
          flutter-version: ${{ env.FLUTTER_VERSION }}
          channel: stable
          cache: true
      - name: Flutter pub get
        run: flutter pub get
      - name: Run Fulus sync contract test
        env:
          FULUS_API_URL: ${{ secrets.FULUS_E2E_API_URL }}
          FULUS_E2E_EMAIL: ${{ secrets.FULUS_E2E_EMAIL }}
          FULUS_E2E_PASSWORD: ${{ secrets.FULUS_E2E_PASSWORD }}
          FULUS_AUTH_URL: https://bejcuvoxemwomcatgyxz.supabase.co
          FULUS_PUBLISHABLE_KEY: sb_publishable_POaHTyngxKH1wEfo9q7v2Q_ddDPrI80
          FULUS_BUSINESS_ID: ${{ secrets.FULUS_E2E_BUSINESS_ID }}
          FULUS_DEVICE_ID: ${{ secrets.FULUS_E2E_DEVICE_ID }}
        run: dart run tool/fulus_sync_e2e.dart

  fulus_multi_device_e2e:
    name: Fulus multi-device convergence test
    needs: fulus_e2e
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Setup Flutter
        uses: subosito/flutter-action@v2
        with:
          flutter-version: ${{ env.FLUTTER_VERSION }}
          channel: stable
          cache: true
      - name: Flutter pub get
        run: flutter pub get
      - name: Run multi-device convergence test
        env:
          FULUS_API_URL: ${{ secrets.FULUS_E2E_API_URL }}
          FULUS_E2E_EMAIL: ${{ secrets.FULUS_E2E_EMAIL }}
          FULUS_E2E_PASSWORD: ${{ secrets.FULUS_E2E_PASSWORD }}
          FULUS_AUTH_URL: https://bejcuvoxemwomcatgyxz.supabase.co
          FULUS_PUBLISHABLE_KEY: sb_publishable_POaHTyngxKH1wEfo9q7v2Q_ddDPrI80
          FULUS_BUSINESS_ID: ${{ secrets.FULUS_E2E_BUSINESS_ID }}
          FULUS_DEVICE_ID: ${{ secrets.FULUS_E2E_DEVICE_ID }}
        run: dart run tool/fulus_multi_device_e2e.dart

  debug_apk:
    name: Build debug APK
    needs: test
    if: github.event_name == 'workflow_dispatch' && inputs.build_apk == 'debug'
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Setup Flutter
        uses: subosito/flutter-action@v2
        with:
          flutter-version: ${{ env.FLUTTER_VERSION }}
          channel: stable
          cache: true
      - name: Setup Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"
      - name: Flutter pub get
        run: flutter pub get
      - name: Generate code
        run: dart run build_runner build --delete-conflicting-outputs
      - name: Build debug APK
        run: flutter build apk --debug
      - name: Upload debug APK
        uses: actions/upload-artifact@v4
        with:
          name: fulus-mobile-debug-apk-${{ github.run_number }}
          path: build/app/outputs/flutter-apk/app-debug.apk
          if-no-files-found: error
          retention-days: 2

  release_apk:
    name: Build release APK
    if: github.event_name == 'workflow_dispatch' && inputs.build_apk == 'release'
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Setup Flutter
        uses: subosito/flutter-action@v2
        with:
          flutter-version: ${{ env.FLUTTER_VERSION }}
          channel: stable
          cache: true
      - name: Setup Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"
      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: "8.11.1"
      - name: Bootstrap Gradle wrapper
        run: |
          mkdir -p /tmp/gradle-wrapper-bootstrap
          cd /tmp/gradle-wrapper-bootstrap
          touch settings.gradle
          gradle wrapper --distribution-type bin
          cp -v gradlew gradlew.bat "$GITHUB_WORKSPACE/android/"
          cp -v gradle/wrapper/gradle-wrapper.jar "$GITHUB_WORKSPACE/android/gradle/wrapper/"
          chmod +x "$GITHUB_WORKSPACE/android/gradlew"
      - name: Flutter pub get
        run: flutter pub get
      - name: Generate code
        run: dart run build_runner build --delete-conflicting-outputs
      - name: Configure release signing
        env:
          KEYSTORE_B64: ${{ secrets.FULUS_ANDROID_KEYSTORE_BASE64 }}
          KEYSTORE_PASSWORD: ${{ secrets.FULUS_ANDROID_KEYSTORE_PASSWORD }}
          KEY_ALIAS: ${{ secrets.FULUS_ANDROID_KEY_ALIAS }}
          KEY_PASSWORD: ${{ secrets.FULUS_ANDROID_KEY_PASSWORD }}
        run: |
          set -euo pipefail
          for value in KEYSTORE_B64 KEYSTORE_PASSWORD KEY_ALIAS KEY_PASSWORD; do
            if [ -z "${!value}" ]; then echo "::error::Missing required Android release signing secret: $value"; exit 1; fi
          done
          echo "$KEYSTORE_B64" | base64 --decode > android/app/fulus-release.jks
          cat > android/key.properties <<EOF
          storePassword=$KEYSTORE_PASSWORD
          keyPassword=$KEY_PASSWORD
          keyAlias=$KEY_ALIAS
          storeFile=../app/fulus-release.jks
          EOF
          chmod 600 android/key.properties android/app/fulus-release.jks
      - name: Resolve application ID
        id: application
        env:
          APPLICATION_ID: ${{ vars.FULUS_APPLICATION_ID }}
        run: |
          set -euo pipefail
          if [ -z "$APPLICATION_ID" ]; then echo "::error::FULUS_APPLICATION_ID is not configured."; exit 1; fi
          case "$APPLICATION_ID" in com.example.*) echo "::error::FULUS_APPLICATION_ID must not use the placeholder com.example namespace."; exit 1;; esac
          echo "APPLICATION_ID=$APPLICATION_ID" >> "$GITHUB_OUTPUT"
      - name: Resolve API base URL
        id: api
        env:
          INPUT_API_BASE_URL: ""
          REPOSITORY_API_BASE_URL: ${{ vars.API_BASE_URL }}
        run: |
          API_BASE_URL="$INPUT_API_BASE_URL"
          if [ -z "$API_BASE_URL" ]; then API_BASE_URL="$REPOSITORY_API_BASE_URL"; fi
          if [ -z "$API_BASE_URL" ]; then echo "::error::API_BASE_URL is not configured."; exit 1; fi
          if [ "$API_BASE_URL" = "http://10.0.2.2:8000" ]; then echo "::error::API_BASE_URL still points to the Android emulator."; exit 1; fi
          echo "API_BASE_URL=$API_BASE_URL" >> "$GITHUB_OUTPUT"
      - name: Build release APK
        run: flutter build apk --release --dart-define=API_BASE_URL="${{ steps.api.outputs.API_BASE_URL }}"
      - name: Upload release APK
        uses: actions/upload-artifact@v4
        with:
          name: fulus-mobile-release-apk-${{ github.run_number }}
          path: build/app/outputs/flutter-apk/app-release.apk
          if-no-files-found: error
          retention-days: 2
