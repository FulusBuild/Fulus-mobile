name: Fulus Mobile CI

on:
  push:
    branches:
      - main
      - develop

  pull_request:
    branches:
      - main
      - develop

  workflow_dispatch:
    inputs:
      build_apk:
        description: "Build and upload an APK"
        required: true
        default: "none"
        type: choice
        options:
          - none
          - debug
          - release

      api_base_url:
        description: "API base URL for release APK (leave empty to use repository variable)"
        required: false
        default: ""
        type: string

env:
  FLUTTER_VERSION: "3.44.9"

# If several commits are pushed quickly, don't waste CI minutes
# building commits that have already been superseded.
concurrency:
  group: fulus-mobile-ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:

  # ============================================================
  # 1. DEPENDENCIES
  # ============================================================

  dependencies:
    name: Resolve dependencies

    runs-on: ubuntu-latest
    timeout-minutes: 10

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Flutter
        uses: subosito/flutter-action@v2
        with:
          flutter-version: ${{ env.FLUTTER_VERSION }}
          channel: stable
          cache: true

      - name: Flutter version
        run: flutter --version

      - name: Resolve dependencies
        run: flutter pub get


  # ============================================================
  # 2. CODE GENERATION
  # ============================================================

  codegen:
    name: Generate Dart code

    needs: dependencies

    runs-on: ubuntu-latest
    timeout-minutes: 15

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Flutter
        uses: subosito/flutter-action@v2
        with:
          flutter-version: ${{ env.FLUTTER_VERSION }}
          channel: stable
          cache: true

      - name: Flutter pub get
        run: flutter pub get

      - name: Generate code
        run: |
          dart run build_runner build \
            --delete-conflicting-outputs


  # ============================================================
  # 3. STATIC ANALYSIS
  # ============================================================

  analyze:
    name: Static analysis

    needs: codegen

    runs-on: ubuntu-latest
    timeout-minutes: 15

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Flutter
        uses: subosito/flutter-action@v2
        with:
          flutter-version: ${{ env.FLUTTER_VERSION }}
          channel: stable
          cache: true

      - name: Flutter pub get
        run: flutter pub get

      # Generated files are intentionally regenerated here.
      - name: Generate code
        run: |
          dart run build_runner build \
            --delete-conflicting-outputs

      - name: Analyze
        run: flutter analyze --fatal-infos


  # ============================================================
  # 4. TESTS
  # ============================================================

  test:
    name: Flutter tests

    needs: analyze

    runs-on: ubuntu-latest
    timeout-minutes: 20

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Flutter
        uses: subosito/flutter-action@v2
        with:
          flutter-version: ${{ env.FLUTTER_VERSION }}
          channel: stable
          cache: true

      - name: Flutter pub get
        run: flutter pub get

      - name: Generate code
        run: |
          dart run build_runner build \
            --delete-conflicting-outputs

      - name: Run tests
        run: flutter test


  # ============================================================
  # 5. MANUAL DEBUG APK
  #
  # Runs ONLY when you choose:
  #
  # Actions → Fulus Mobile CI → Run workflow
  # Build APK → debug
  #
  # This is the ONLY normal way to consume artifact storage.
  # ============================================================

  debug_apk:
    name: Build debug APK

    needs: test

    if: >
      github.event_name == 'workflow_dispatch' &&
      inputs.build_apk == 'debug'

    runs-on: ubuntu-latest
    timeout-minutes: 30

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Flutter
        uses: subosito/flutter-action@v2
        with:
          flutter-version: ${{ env.FLUTTER_VERSION }}
          channel: stable
          cache: true

      - name: Setup Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - name: Free runner disk space
        run: |
          echo "===== DISK BEFORE CLEANUP ====="
          df -h

          # Remove large preinstalled Android components not required for APK compilation.
          sudo rm -rf /usr/local/lib/android/sdk/system-images || true
          sudo rm -rf /usr/local/lib/android/sdk/emulator || true
          sudo rm -rf /usr/local/lib/android/sdk/platform-tools || true

          # Remove large preinstalled tools that this workflow does not need.
          sudo rm -rf /usr/local/share/powershell || true
          sudo rm -rf /usr/local/lib/node_modules || true
          sudo rm -rf /opt/hostedtoolcache/CodeQL || true

          echo "===== DISK AFTER CLEANUP ====="
          df -h

      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: "8.11.1"

      - name: Bootstrap Gradle wrapper
        run: |
          mkdir -p /tmp/gradle-wrapper-bootstrap
          cd /tmp/gradle-wrapper-bootstrap

          touch settings.gradle

          gradle wrapper --distribution-type bin

          cp -v gradlew gradlew.bat \
            "$GITHUB_WORKSPACE/android/"

          cp -v gradle/wrapper/gradle-wrapper.jar \
            "$GITHUB_WORKSPACE/android/gradle/wrapper/"

          chmod +x "$GITHUB_WORKSPACE/android/gradlew"

      - name: Flutter pub get
        run: flutter pub get

      - name: Generate code
        run: |
          dart run build_runner build \
            --delete-conflicting-outputs

      - name: Build debug APK
        run: flutter build apk --debug

      - name: Upload debug APK
        uses: actions/upload-artifact@v4
        with:
          name: fulus-mobile-debug-apk-${{ github.run_number }}
          path: build/app/outputs/flutter-apk/app-debug.apk
          if-no-files-found: error
          retention-days: 2


  # ============================================================
  # 6. MANUAL RELEASE APK
  #
  # Runs ONLY when explicitly requested.
  # ============================================================

  release_apk:
    name: Build release APK

    if: >
      github.event_name == 'workflow_dispatch' &&
      inputs.build_apk == 'release'

    runs-on: ubuntu-latest
    timeout-minutes: 30

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Flutter
        uses: subosito/flutter-action@v2
        with:
          flutter-version: ${{ env.FLUTTER_VERSION }}
          channel: stable
          cache: true

      - name: Setup Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: "8.11.1"

      - name: Bootstrap Gradle wrapper
        run: |
          mkdir -p /tmp/gradle-wrapper-bootstrap
          cd /tmp/gradle-wrapper-bootstrap

          touch settings.gradle

          gradle wrapper --distribution-type bin

          cp -v gradlew gradlew.bat \
            "$GITHUB_WORKSPACE/android/"

          cp -v gradle/wrapper/gradle-wrapper.jar \
            "$GITHUB_WORKSPACE/android/gradle/wrapper/"

          chmod +x "$GITHUB_WORKSPACE/android/gradlew"

      - name: Flutter pub get
        run: flutter pub get

      - name: Generate code
        run: |
          dart run build_runner build \
            --delete-conflicting-outputs

      - name: Resolve API base URL
        id: api
        env:
          INPUT_API_BASE_URL: ${{ inputs.api_base_url }}
          REPOSITORY_API_BASE_URL: ${{ vars.API_BASE_URL }}
        run: |
          API_BASE_URL="$INPUT_API_BASE_URL"

          if [ -z "$API_BASE_URL" ]; then
            API_BASE_URL="$REPOSITORY_API_BASE_URL"
          fi

          if [ -z "$API_BASE_URL" ]; then
            echo "::error::API_BASE_URL is not configured."
            exit 1
          fi

          if [ "$API_BASE_URL" = "http://10.0.2.2:8000" ]; then
            echo "::error::API_BASE_URL still points to the Android emulator."
            exit 1
          fi

          echo "API_BASE_URL=$API_BASE_URL" >> "$GITHUB_OUTPUT"

      - name: Build release APK
        run: |
          flutter build apk \
            --release \
            --dart-define=API_BASE_URL="${{ steps.api.outputs.API_BASE_URL }}"

      - name: Upload release APK
        uses: actions/upload-artifact@v4
        with:
          name: fulus-mobile-release-apk-${{ github.run_number }}
          path: build/app/outputs/flutter-apk/app-release.apk
          if-no-files-found: error
          retention-days: 2