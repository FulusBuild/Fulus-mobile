name: Temporary Drift Import Fix

on:
  push:
    branches:
      - ui/reference-convergence-pass-a

permissions:
  contents: write

jobs:
  fix:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ui/reference-convergence-pass-a
      - name: Restore required repository imports
        run: |
          python3 - <<'PY'
          from pathlib import Path

          files = [
              'lib/data/repositories/finance_stats_repository_impl.dart',
              'lib/data/repositories/search_repository_impl.dart',
          ]
          for filename in files:
              path = Path(filename)
              text = path.read_text()
              if "import 'package:drift/drift.dart';" not in text:
                  text = "import 'package:drift/drift.dart';\n\n" + text.lstrip('\n')
                  path.write_text(text)

          path = Path('lib/data/repositories/reports_repository_impl.dart')
          text = path.read_text()
          if "import 'employee_mapper.dart';" not in text:
              text = text.replace(
                  "import 'package:drift/drift.dart';\n\n",
                  "import 'package:drift/drift.dart';\n\nimport 'employee_mapper.dart';\n",
                  1,
              )
              path.write_text(text)
          PY
      - name: Commit source-only fix
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add lib/data/repositories/finance_stats_repository_impl.dart lib/data/repositories/search_repository_impl.dart lib/data/repositories/reports_repository_impl.dart
          git diff --cached --check
          if ! git diff --cached --quiet; then
            git commit -m "fix: restore required Drift repository imports"
            git push origin HEAD:ui/reference-convergence-pass-a
          fi
