publish_to: "none"
version: 0.1.0+1

environment:
  sdk: ">=3.10.0 <4.0.0"

dependencies:
  flutter:
    sdk: flutter
  flutter_riverpod: ^3.3.2
  riverpod_annotation: ^4.0.3
  flutter_bloc: ^8.1.5
  go_router: ^14.2.0
  drift: ^2.18.0
  sqlite3_flutter_libs: ^0.6.0+eol
  path_provider: ^2.1.3
  path: ^1.9.0
  dio: ^5.5.0+1
  connectivity_plus: ^6.0.4
  flutter_secure_storage: ^10.1.0
  local_auth: ^3.0.2
  workmanager: ^0.10.9
  ulid: ^2.0.1
  equatable: ^2.0.5
  freezed_annotation: ^3.1.0
  json_annotation: ^4.9.0
  cryptography: ^2.9.0
  crypto: ^3.0.5
  cupertino_icons: ^1.0.8
  sqlite3: ^3.5.2
  pdf: ^3.11.1
  printing: ^5.13.4
  share_plus: ^13.0.0
  flutter_local_notifications: ^18.0.1
  file_picker: ^12.0.0
  mobile_scanner: ^6.0.2
