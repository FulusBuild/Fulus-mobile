  package_info_plus: ^10.2.1
  device_info_plus: ^13.2.0
  app_links: ^7.0.0

dev_dependencies:
  flutter_test:
    sdk: flutter
  build_runner: ^2.4.11
  riverpod_generator: ^4.0.4
  drift_dev: ^2.18.0
  freezed: ^3.2.6-dev.1
  json_serializable: ^6.8.0
  flutter_lints: ^4.0.0
  mocktail: ^1.0.4

flutter:
  uses-material-design: true
  assets:
    - assets/branding/
