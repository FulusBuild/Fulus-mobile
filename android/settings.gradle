pluginManagement {
    def flutterSdkPath = {
        def properties = new Properties()
        file("local.properties").withInputStream { properties.load(it) }
        def flutterSdkPath = properties.getProperty("flutter.sdk")
        assert flutterSdkPath != null, "flutter.sdk not set in local.properties"
        return flutterSdkPath
    }()

    includeBuild("$flutterSdkPath/packages/flutter_tools/gradle")

    repositories {
        google()
        mavenCentral()
        gradlePluginPortal()
    }
}

plugins {
    id "dev.flutter.flutter-plugin-loader" version "1.0.0"
    // AGP 8.3.0 / Kotlin 1.9.22 — chosen to satisfy Flutter 3.24.0's
    // minimum supported Android Gradle Plugin (>=8.1.1) and Gradle
    // (>=8.3) requirements with headroom, while staying within AGP 8.3's
    // documented max supported compileSdk of 34 (Flutter 3.24.0's
    // default). See android/gradle/wrapper/gradle-wrapper.properties for
    // the paired Gradle version.
    id "com.android.application" version "8.3.0" apply false
    id "org.jetbrains.kotlin.android" version "1.9.22" apply false
}

include ":app"
