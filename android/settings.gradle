pluginManagement {
    def flutterSdkPath = {
        def properties = new Properties()
        file("local.properties").withInputStream { properties.load(it) }
        def flutterSdkPath = properties.getProperty("flutter.sdk")
        assert flutterSdkPath != null, "flutter.sdk not set in local.properties"
        return flutterSdkPath
    }()

    includeBuild("$flutterSdkPath/packages/flutter_tools/gradle")

    repositories {
        google()
        mavenCentral()
        gradlePluginPortal()
    }
}

plugins {
    id "dev.flutter.flutter-plugin-loader" version "1.0.0"
    // AGP 8.9.1 / Kotlin 1.9.22 — bumped from AGP 8.3.0 because
    // androidx.camera 1.5.0 (pulled in by the camera/mobile_scanner
    // plugins) requires AGP >=8.6.0 and compiling against API 35+,
    // and mobile_scanner itself asks for API 36 — AGP 8.9.1 has
    // headroom for both (compileSdk bumped to 36 in app/build.gradle
    // accordingly). Needs Gradle >=8.11.1 to match — see
    // android/gradle/wrapper/gradle-wrapper.properties.
    id "com.android.application" version "8.9.1" apply false
    id "org.jetbrains.kotlin.android" version "1.9.22" apply false
}

include ":app"
