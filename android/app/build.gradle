plugins {
    id "com.android.application"
    id "kotlin-android"
    // The Flutter Gradle Plugin must be applied after the Android and
    // Kotlin Gradle plugins.
    id "dev.flutter.flutter-gradle-plugin"
}

def keystoreProperties = new Properties()
def keystorePropertiesFile = rootProject.file("key.properties")
if (keystorePropertiesFile.exists()) {
    keystorePropertiesFile.withInputStream { keystoreProperties.load(it) }
}

android {
    // No company domain is stated anywhere in this repo (no README, no
    // docs, no existing platform folder, nothing in code/comments/commit
    // history) to base a real reverse-domain applicationId on. Rather
    // than invent one, this uses Flutter's own standard placeholder org
    // — the same "com.example" `flutter create` uses when no --org is
    // given — combined with the pubspec package name. Rename this (and
    // the matching applicationId below, and the Kotlin package
    // declaration/directory at app/src/main/kotlin/com/example/fulus_mobile/)
    // to your real domain before any Play Store submission — Google
    // rejects com.example.* applicationIds at publish time, though it
    // builds and installs fine for this checkpoint's debug APK.
    namespace = "com.example.fulus_mobile"
    // compileSdk/ndkVersion are pinned explicitly rather than deferred
    // to Flutter's own recommended defaults (flutter.compileSdkVersion/
    // flutter.ndkVersion): several plugins now require higher versions
    // than Flutter 3.44.9's own defaults resolve to —
    // androidx.camera:*:1.5.0 (via the camera/mobile_scanner plugins)
    // needs compileSdk >=35, and mobile_scanner itself asks for 36.
    // ndkVersion was raised a second time, from 25.1.8937393 to
    // 27.0.12077973, after the CI log for this exact pin started listing
    // 17 plugins (android_file_picker, camera_android_camerax,
    // connectivity_plus, device_info_plus, flutter_local_notifications,
    // flutter_plugin_android_lifecycle, flutter_secure_storage,
    // flutter_usb_printer, jni_flutter, mobile_scanner, package_info_plus,
    // permission_handler_android, print_bluetooth_thermal, printing,
    // share_plus, shared_preferences_android, workmanager) all asking for
    // 27.0.12077973 — the CI warning's own suggested fix. Both bumps are
    // backward compatible per Android's own guidance, so this is safe even
    // for plugins that don't strictly need the newer versions.
    compileSdk = 36
    ndkVersion = "27.0.12077973"

    compileOptions {
        sourceCompatibility = JavaVersion.VERSION_17
        targetCompatibility = JavaVersion.VERSION_17
        // flutter_local_notifications requires core library
        // desugaring — see the coreLibraryDesugaring dependency below.
        coreLibraryDesugaringEnabled = true
    }

    kotlinOptions {
        jvmTarget = "17"
    }

    defaultConfig {
        applicationId = "com.example.fulus_mobile"
        // Android 8.0 (API 26) is the architecture document's stated
        // floor (see pubspec.yaml's own environment comment) — an
        // explicit override of Flutter's own lower default
        // (flutter.minSdkVersion), not a value inherited from it.
        minSdk = 26
        targetSdk = flutter.targetSdkVersion
        versionCode = flutter.versionCode
        versionName = flutter.versionName
    }

    signingConfigs {
        release {
            if (keystorePropertiesFile.exists()) {
                keyAlias = keystoreProperties["keyAlias"]
                keyPassword = keystoreProperties["keyPassword"]
                storeFile = file(keystoreProperties["storeFile"])
                storePassword = keystoreProperties["storePassword"]
            }
        }
    }

    buildTypes {
        release {
            // Production artifacts must never be signed with the debug key.
            // CI/local release builds require android/key.properties.
            if (!keystorePropertiesFile.exists()) {
                throw new GradleException(
                    "Release signing is not configured. Provide android/key.properties from key.properties.example."
                )
            }
            signingConfig = signingConfigs.release
        }
    }
}

flutter {
    source = "../.."
}

dependencies {
    // Required by compileOptions.coreLibraryDesugaringEnabled above —
    // flutter_local_notifications needs this to build against AGP 8's
    // AAR-metadata check.
    coreLibraryDesugaring "com.android.tools:desugar_jdk_libs:2.1.4"
}
