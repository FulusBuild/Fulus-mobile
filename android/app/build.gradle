plugins {
    id "com.android.application"
    id "kotlin-android"
    // The Flutter Gradle Plugin must be applied after the Android and
    // Kotlin Gradle plugins.
    id "dev.flutter.flutter-gradle-plugin"
}

android {
    // No company domain is stated anywhere in this repo (no README, no
    // docs, no existing platform folder, nothing in code/comments/commit
    // history) to base a real reverse-domain applicationId on. Rather
    // than invent one, this uses Flutter's own standard placeholder org
    // — the same "com.example" `flutter create` uses when no --org is
    // given — combined with the pubspec package name. Rename this (and
    // the matching applicationId below, and the Kotlin package
    // declaration/directory at app/src/main/kotlin/com/example/bms_mobile/)
    // to your real domain before any Play Store submission — Google
    // rejects com.example.* applicationIds at publish time, though it
    // builds and installs fine for this checkpoint's debug APK.
    namespace = "com.example.bms_mobile"
    // compileSdk/targetSdk/ndkVersion are deliberately deferred to the
    // Flutter Gradle plugin's own recommended values for whichever
    // Flutter SDK actually runs this build (currently pinned to 3.24.0 —
    // see ../../.github/workflows/ci.yml), rather than hardcoded here.
    // That keeps this file correct automatically if FLUTTER_VERSION is
    // ever bumped, instead of silently building against a stale API
    // level. dargon2_flutter's native library is the one plugin in this
    // project with real NDK-compiled code, so deferring ndkVersion here
    // specifically avoids an NDK mismatch between what Flutter installed
    // and what this file assumes is present.
    compileSdk = flutter.compileSdkVersion
    ndkVersion = flutter.ndkVersion

    compileOptions {
        sourceCompatibility = JavaVersion.VERSION_17
        targetCompatibility = JavaVersion.VERSION_17
    }

    kotlinOptions {
        jvmTarget = "17"
    }

    defaultConfig {
        applicationId = "com.example.bms_mobile"
        // Android 8.0 (API 26) is the architecture document's stated
        // floor (see pubspec.yaml's own environment comment) — an
        // explicit override of Flutter's own lower default
        // (flutter.minSdkVersion), not a value inherited from it.
        minSdk = 26
        targetSdk = flutter.targetSdkVersion
        versionCode = flutter.versionCode
        versionName = flutter.versionName
    }

    buildTypes {
        release {
            // TODO: Add a real signing config before shipping a release
            // build. Signed with the debug key for now so `flutter build
            // apk --debug` (this checkpoint's target) and `flutter build
            // apk --release` both succeed without requiring a keystore
            // that doesn't exist yet.
            signingConfig = signingConfigs.debug
        }
    }
}

flutter {
    source = "../.."
}

dependencies {}
