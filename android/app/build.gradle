plugins {
    id "com.android.application"
    id "kotlin-android"
    // The Flutter Gradle Plugin must be applied after the Android and
    // Kotlin Gradle plugins.
    id "dev.flutter.flutter-gradle-plugin"
}

def keystoreProperties = new Properties()
def keystorePropertiesFile = rootProject.file("key.properties")
if (keystorePropertiesFile.exists()) {
    keystorePropertiesFile.withInputStream { keystoreProperties.load(it) }
}

android {
    // Production application identity is supplied by CI via
    // FULUS_APPLICATION_ID. Keep the native namespace aligned with the
    // production package so generated/compiled Android components use the
    // same stable identity as the release artifact.
    namespace = "com.fulus.app"

    // Pin the Android SDK/NDK toolchain used by release builds. This keeps
    // the release artifact reproducible when the Flutter SDK changes its
    // recommended defaults. Camera/mobile_scanner require compileSdk 36.
    compileSdk = 36
    ndkVersion = "27.0.12077973"

    compileOptions {
        sourceCompatibility = JavaVersion.VERSION_17
        targetCompatibility = JavaVersion.VERSION_17
        // flutter_local_notifications requires core library desugaring.
        coreLibraryDesugaringEnabled = true
    }

    kotlinOptions {
        jvmTarget = "17"
    }

    defaultConfig {
        applicationId = System.getenv("FULUS_APPLICATION_ID") ?: "com.fulus.app"
        // Android 8.0 (API 26) is the supported platform floor.
        minSdk = 26
        // Keep the production target explicit instead of inheriting a
        // Flutter SDK default that could change when Flutter is upgraded.
        targetSdk = 36
        versionCode = flutter.versionCode
        versionName = flutter.versionName
    }

    signingConfigs {
        release {
            if (keystorePropertiesFile.exists()) {
                keyAlias = keystoreProperties["keyAlias"]
                keyPassword = keystoreProperties["keyPassword"]
                storeFile = file(keystoreProperties["storeFile"])
                storePassword = keystoreProperties["storePassword"]
            }
        }
    }

    buildTypes {
        release {
            // Production artifacts must never be signed with the debug key.
            // CI/local release builds require android/key.properties.
            if (!keystorePropertiesFile.exists()) {
                throw new GradleException(
                    "Release signing is not configured. Provide android/key.properties from key.properties.example."
                )
            }
            signingConfig = signingConfigs.release
        }
    }
}

flutter {
    source = "../.."
}

dependencies {
    // Required by compileOptions.coreLibraryDesugaringEnabled above.
    coreLibraryDesugaring "com.android.tools:desugar_jdk_libs:2.1.4"
}
