org.gradle.jvmargs=-Xmx4G -XX:MaxMetaspaceSize=2G -XX:+HeapDumpOnOutOfMemoryError
android.useAndroidX=true
android.enableJetifier=true

# flutter_usb_printer (see the comments on the Kotlin-Gradle-Plugin
# version force and the namespace backfill in build.gradle for the same
# category of problem) pins its own compileOptions to Java 1.8 in its
# own build.gradle, which lives in the pub cache and can't be edited
# here. It never sets an explicit Kotlin jvmTarget, so the Kotlin
# Gradle Plugin defaults it to whatever JDK is actually running Gradle
# — 17 in this project's pinned toolchain (JavaVersion.VERSION_17 in
# app/build.gradle, actions/setup-java in CI) — which AGP 8 then
# refuses to build as an "Inconsistent JVM-target compatibility" error
# between that plugin's Java 1.8 and Kotlin's implicit 17.
#
# `warning` (rather than the Gradle-8+ default of `error`) demotes this
# specific check to a log line instead of a build failure. Java
# bytecode compiled for 1.8 running under a JVM 17 runtime is normal
# and safe — that mismatch is exactly what bytecode forward
# compatibility means — so this doesn't change what actually runs, it
# just stops one unmaintained plugin's own stale build script from
# blocking CI over it. Not `ignore`, so the warning stays visible if
# this ever needs a real look.
kotlin.jvm.target.validation.mode=warning
