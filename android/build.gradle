allprojects {
    repositories {
        google()
        mavenCentral()
    }
}

// Forces every subproject's *buildscript* classpath resolution of the
// Kotlin Gradle Plugin to match this project's own Kotlin version
// (2.1.0, declared in settings.gradle — bumped from 1.9.22 because
// mobile_scanner's own kotlinx-coroutines-core-jvm dependency is
// compiled with Kotlin 2.1.0 metadata that a 1.9.22 compiler can't
// read; see the settings.gradle comment for the full story),
// regardless of what version that subproject's own build.gradle asks
// for. Needed for old, unmaintained plugins (flutter_usb_printer in
// particular) that pin an ancient Kotlin Gradle Plugin (1.4.32) in
// their own top-level `buildscript { dependencies { classpath ... } }`
// block — AGP 8+ refuses to build against anything below 1.5.20.
// Those plugins live in the pub cache, not this repo, so their
// build.gradle can't be edited directly.
//
// This has to be a `resolutionStrategy.force` on each subproject's
// `buildscript.configurations.classpath`, not a regular dependency
// override: a subproject's own `buildscript {}` block is a separate
// classpath from its regular dependencies, and root-level
// `subprojects {}` configuration closures run against each subproject
// before that subproject's own build.gradle script (including its own
// `buildscript {}` block) is evaluated — so this registers the force
// early enough to still apply once that script's own classpath
// dependency is added, since `force` operates at resolution time, not
// declaration time.
subprojects {
    buildscript {
        configurations.classpath {
            resolutionStrategy {
                force "org.jetbrains.kotlin:kotlin-gradle-plugin:2.1.0"
            }
        }
    }
}

rootProject.buildDir = "../build"

subprojects {
    project.buildDir = "${rootProject.buildDir}/${project.name}"
}

// Workaround for old, unmaintained plugins (flutter_usb_printer in
// particular) that predate AGP's namespace requirement: AGP 8+ needs
// every Android library module to declare `namespace` in its own
// build.gradle, but plugins built before that requirement only ever
// set the legacy `package` attribute in AndroidManifest.xml. Since
// those plugins live in the pub cache, not this repo, they can't be
// edited directly — this reads that manifest attribute and back-fills
// `namespace` for any library module that doesn't already have one,
// leaving already-namespaced modules untouched.
//
// Uses pluginManager.withPlugin rather than afterEvaluate: withPlugin
// fires the instant "com.android.library" is applied to a subproject,
// regardless of that subproject's own evaluation order relative to
// this file or to :app — so it can't miss a subproject that happens
// to evaluate before this block runs, and doesn't risk registering a
// new afterEvaluate on a project Gradle already considers evaluated.
//
// (An earlier version of this file also forced every subproject to
// evaluate before :app via `subprojects { evaluationDependsOn(":app") }`,
// which was the original reason afterEvaluate was unsafe here. That
// line was removed — it broke plugins such as file_picker whose own
// build.gradle reads `flutter.compileSdkVersion`/`flutter.ndkVersion`
// off the root `flutter {}` extension in android/app/build.gradle:
// forcing those plugins to evaluate before :app meant they ran before
// the Flutter Gradle Plugin (applied inside :app) had populated that
// extension, so Gradle saw `flutter` as an unknown property on their
// LibraryExtension and their compileSdk was never set. withPlugin
// doesn't need that ordering guarantee, so removing it only affects
// the afterEvaluate-vs-withPlugin choice this comment documents.)
subprojects {
    pluginManager.withPlugin("com.android.library") {
        def androidExt = project.extensions.findByName("android")
        if (androidExt != null && androidExt.namespace == null) {
            def manifestFile = file("${project.projectDir}/src/main/AndroidManifest.xml")
            if (manifestFile.exists()) {
                def manifestXml = new XmlSlurper().parse(manifestFile)
                def packageName = manifestXml.@package.text()
                if (packageName) {
                    androidExt.namespace = packageName
                }
            }
        }
    }
}

tasks.register("clean", Delete) {
    delete rootProject.buildDir
}
