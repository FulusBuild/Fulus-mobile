allprojects {
    repositories {
        google()
        mavenCentral()
    }
}

// Forces every subproject's *buildscript* classpath resolution of the
// Kotlin Gradle Plugin to match this project's own Kotlin version
// (2.1.0, declared in settings.gradle — bumped from 1.9.22 because
// mobile_scanner's own kotlinx-coroutines-core-jvm dependency is
// compiled with Kotlin 2.1.0 metadata that a 1.9.22 compiler can't
// read; see the settings.gradle comment for the full story),
// regardless of what version that subproject's own build.gradle asks
// for. Needed for old, unmaintained plugins (flutter_usb_printer in
// particular) that pin an ancient Kotlin Gradle Plugin (1.4.32) in
// their own top-level `buildscript { dependencies { classpath ... } }`
// block — AGP 8+ refuses to build against anything below 1.5.20.
// Those plugins live in the pub cache, not this repo, so their
// build.gradle can't be edited directly.
//
// This has to be a `resolutionStrategy.force` on each subproject's
// `buildscript.configurations.classpath`, not a regular dependency
// override: a subproject's own `buildscript {}` block is a separate
// classpath from its regular dependencies, and root-level
// `subprojects {}` configuration closures run against each subproject
// before that subproject's own build.gradle script (including its own
// `buildscript {}` block) is evaluated — so this registers the force
// early enough to still apply once that script's own classpath
// dependency is added, since `force` operates at resolution time, not
// declaration time.
subprojects {
    buildscript {
        configurations.classpath {
            resolutionStrategy {
                force "org.jetbrains.kotlin:kotlin-gradle-plugin:2.1.0"
            }
        }
    }
}

rootProject.buildDir = "../build"

subprojects {
    project.buildDir = "${rootProject.buildDir}/${project.name}"
}
subprojects {
    project.evaluationDependsOn(":app")
}

// Workaround for old, unmaintained plugins (flutter_usb_printer in
// particular) that predate AGP's namespace requirement: AGP 8+ needs
// every Android library module to declare `namespace` in its own
// build.gradle, but plugins built before that requirement only ever
// set the legacy `package` attribute in AndroidManifest.xml. Since
// those plugins live in the pub cache, not this repo, they can't be
// edited directly — this reads that manifest attribute and back-fills
// `namespace` for any library module that doesn't already have one,
// leaving already-namespaced modules untouched.
//
// Uses pluginManager.withPlugin rather than afterEvaluate: the
// `evaluationDependsOn(":app")` above forces some plugin subprojects
// to evaluate eagerly during this file's own configuration, so by the
// time a later `subprojects { afterEvaluate { ... } }` block runs,
// those subprojects may already be evaluated — Gradle refuses to
// register a new afterEvaluate on an already-evaluated project.
// withPlugin fires the instant the plugin is applied, independent of
// each subproject's evaluation order, so it can't lose that race.
subprojects {
    pluginManager.withPlugin("com.android.library") {
        def androidExt = project.extensions.findByName("android")
        if (androidExt != null && androidExt.namespace == null) {
            def manifestFile = file("${project.projectDir}/src/main/AndroidManifest.xml")
            if (manifestFile.exists()) {
                def manifestXml = new XmlSlurper().parse(manifestFile)
                def packageName = manifestXml.@package.text()
                if (packageName) {
                    androidExt.namespace = packageName
                }
            }
        }
    }
}

// Workaround for file_picker (pinned to 11.0.3 via pubspec.yaml's
// `file_picker: ^11.0.0`) referencing `flutter.compileSdkVersion` in its
// own android/build.gradle — added upstream to close
// https://github.com/miguelpruivo/flutter_file_picker/issues/1842, and
// present in every file_picker release from 10.3.3 through the current
// 11.x/12.x lines, so it can't be dodged by picking a different 11.x
// patch version.
//
// That reference only resolves where the Flutter Gradle Plugin injects a
// `flutter` extension into plugin *subprojects* — on this project's
// pinned Flutter 3.24.0 (see FLUTTER_VERSION in the CI workflow), that
// extension is only ever registered on the `:app` module itself; plugin
// subprojects never get one, in any evaluation order. (Compare
// flutter_plugin_android_lifecycle's own changelog, which notes it only
// started relying on `flutter.compileSdkVersion` in its build.gradle
// after bumping its *minimum supported Flutter version* to 3.27 — i.e.
// the injection point plugin authors now assume is a Flutter 3.27+
// mechanism that 3.24.0 predates.) So this isn't a script-evaluation-order
// problem — forcing subprojects to evaluate after `:app`
// (`evaluationDependsOn(":app")` above) doesn't help, because the
// property is never defined for subprojects on this Flutter version no
// matter when they evaluate. Without this, the build fails first with
// "Could not get unknown property 'flutter' for extension 'android'"
// (the property lookup falls through to nothing) and then, as a
// consequence of the resulting `compileSdk` assignment never running,
// with "compileSdkVersion is not specified".
//
// Defining `flutter` as a plain extra-property Map (Groovy resolves
// `flutter.compileSdkVersion` on a Map the same way it would on the real
// extension) sidesteps that gap. It carries the same compileSdk value
// app/build.gradle already pins explicitly for the same reason (several
// plugins need a higher compileSdk than Flutter 3.24.0's own default) —
// this just makes that one value visible to plugin subprojects too. Like
// the Kotlin-version-forcing block above, this runs as part of root
// project configuration, i.e. before any subproject's own build.gradle
// script is evaluated, so it's in place well before file_picker's script
// reads it.
//
// Excludes `:app` by name (not by checking hasProperty("flutter") — at
// this point in root's configuration, :app hasn't applied
// "dev.flutter.flutter-gradle-plugin" yet either, so that check can't
// tell the two cases apart). `:app` gets its own real `flutter`
// extension — a `FlutterExtension` instance, not a Map — when its own
// build.gradle applies the Flutter Gradle Plugin; setting this fake one
// there first would fight that later, real registration.
//
// `ndkVersion` was added to this Map alongside `compileSdkVersion` after
// the same gap surfaced a second way: `jni` (pub.dev's JNI support
// library — a transitive dependency, not listed directly in
// pubspec.yaml, most likely pulled in by device_info_plus's Android
// implementation) ships an android/build.gradle containing the standard
// FFI-plugin-template line `ndkVersion flutter.ndkVersion`. Against this
// fake Map with no `ndkVersion` key, Groovy property access on a missing
// key returns null rather than throwing — so that line silently became
// `ndkVersion null`, which AGP's LibraryExtension.setNdkVersion (a
// Kotlin non-null parameter) rejects with "Parameter specified as
// non-null is null" instead of the clearer missing-property error
// compileSdkVersion's absence used to produce. Same fix as above: give
// the Map the real value (matching app/build.gradle's own explicit
// `ndkVersion` pin) so any other plugin reading `flutter.ndkVersion`
// resolves it correctly too, rather than special-casing `jni` alone.
subprojects {
    if (project.name != "app") {
        project.ext.flutter = [compileSdkVersion: 36, ndkVersion: "25.1.8937393"]
    }
}

tasks.register("clean", Delete) {
    delete rootProject.buildDir
}
